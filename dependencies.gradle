dependencies {
    // Minecraft Forge 1.7.10
    compileOnly "net.minecraftforge:forge:1.7.10-10.13.4.1614-1.7.10"

    // Mixin support for 1.7.10
    api "com.github.LegacyModdingMC:UniMixins:0.1.14:dev"

    // MetaWorld Mixins - SubWorldClient API (su.sergiusonesimus.metaworlds)
    // :dev classifier gives us the deobf sources to compile against
    api "com.github.Gordon-Frohman:MetaWorlds-Mixins:1.6.1:dev"

    // JOML - Matrix math (replaces com.mojang.math in 1.7.10)
    api "org.joml:joml:1.10.8"

    // Development Annotations
    compileOnly "org.jetbrains:annotations:24.0.1"
}

configurations {
    api.extendsFrom implementation
}
