name: Build
on:
  push:
    branches:
      - mixins
    tags:
      - '*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build -PghUsername=Apostrcfo2 -PghToken=${{ secrets.GH_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponder-1710-jar
          path: build/libs/*.jar
